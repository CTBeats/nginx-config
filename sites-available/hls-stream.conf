proxy_cache_path /var/cache/nginx_hls_cache
    levels=1:2
    keys_zone=hls_cache:10m
    max_size=10g
    inactive=60m
    use_temp_path=off;

# --------------------------------------------------
# DEFAULT HTTP — DROP EVERYTHING
# --------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# --------------------------------------------------
# VALID HTTP HOST — REDIRECT TO HTTPS
# --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stream-hls.ctbeatsmedia.com;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------
# DEFAULT HTTPS — DUMMY CERT + DROP
# --------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/dummy.pem;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;

    return 444;
}

# --------------------------------------------------
# REAL HTTPS HLS SERVER
# --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stream-hls.ctbeatsmedia.com;

    ssl_certificate /etc/nginx/ssl/ctbeatsmedia.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ctbeatsmedia.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_ecdh_curve X25519:secp256r1;

    # -------------------------------
    # HLS PLAYLIST (NO CACHE)
    # -------------------------------
    location ~ \.m3u8$ {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # -------------------------------
    # HLS SEGMENTS (CACHE OK)
    # -------------------------------
    location ~ \.(ts|aac|m4s)$ {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

        proxy_cache hls_cache;
        proxy_cache_key $scheme$proxy_host$uri$args;
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # -------------------------------
    # FALLBACK
    # -------------------------------
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}

# ============================
# Upstream backend (Icecast)
# ============================
upstream icecast_upstream {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ============================
# Redirect ALL HTTP to HTTPS
# ============================

# Public stream domain
server {
    listen 80;
    listen [::]:80;
    server_name stream.ctbeatsmedia.com;
    return 301 https://stream.ctbeatsmedia.com$request_uri;
}

# Internal-only domain
server {
    listen 80;
    listen [::]:80;
    server_name icecast2_internal.ctbeatsmedia.com;
    return 301 https://icecast2_internal.ctbeatsmedia.com$request_uri;
}

# ============================
# Public streaming server
# ============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stream.ctbeatsmedia.com;

    ssl_certificate /etc/nginx/ssl/ctbeatsmedia.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ctbeatsmedia.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # Cloudflare-compatible
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Streaming-specific
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_ignore_client_abort on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;

    # Block admin UI and version
    location ^~ /admin/ {
        deny all;
    }
    location = /server_version.xsl {
        deny all;
    }

    # Pass all other requests to Icecast
    location / {
        proxy_pass http://icecast_upstream;

        # Substitute URLs and hostnames
        subs_filter_types application/xspf+xml audio/x-mpegurl audio/x-vclt text/css text/xml;
        subs_filter ':8000/' '/' gi;
        subs_filter '@localhost' '@example.com' gi;
        subs_filter 'localhost' $host gi;
        subs_filter 'Mount Point ' $host gi;
        subs_filter '<h1 id="header">Icecast2 Status</h1><div id="menu"><ul><li><a href="admin/">Administration</a></li><li><a href="status.xsl">Server Status</a></li><li><a href="server_version.xsl">Version</a></li></ul></div>' '<!--<div id="menu"><ul><li><a href="admin/">Administration</a></li><li><a href="status.xsl">Server Status</a></li><li><a href="server_version.xsl">Version</a></li></ul></div>-->' gi;
    }
}

# ============================
# Internal-only server
# ============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name icecast2_internal.ctbeatsmedia.com;

    ssl_certificate /etc/nginx/ssl/ctbeatsmedia.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ctbeatsmedia.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # Cloudflare-compatible
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Restrict access to localhost only
    #allow 127.0.0.1;
    #deny all;

    # Proxy headers and streaming
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_ignore_client_abort on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://icecast_upstream;

        # Substitute URLs and hostnames
        subs_filter_types application/xspf+xml audio/x-mpegurl audio/x-vclt text/css text/xml;
        subs_filter ':8000/' '/' gi;
        subs_filter '@localhost' '@example.com' gi;
        subs_filter 'localhost' $host gi;
        subs_filter 'Mount Point ' $host gi;
    }
}